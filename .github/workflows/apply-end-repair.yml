name: End-Generator sicher reparieren (Server muss gestoppt sein)
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: Vollstaendiges Backup nach sauberem Server-Stopp erstellt und Server bleibt aus
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: halfknife-end-repair-test
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 -m pip install nbtlib==2.0.4
      - name: Erneut isoliert testen, Original sichern und ausschliesslich End-Generator ersetzen
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
          END_REPAIR_APPLY: 'true'
          END_REPAIR_BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: python3 -u scripts/prepare_end_repair.py
