name: HalfKnife aktive Spielzeit bauen und installieren
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halfknife-active-playtime-install
  cancel-in-progress: false
jobs:
  build-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Mod kompilieren und AFK-Zähler testen
        working-directory: mods/halfknife-active-playtime
        run: gradle build --no-daemon --stacktrace
      - name: Isolierten Testserver starten
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/smoke_active_playtime.py
      - name: Getestete Mod auf den Server übertragen
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/install_active_playtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: halfknife-active-playtime-1.2.0
          path: mods/halfknife-active-playtime/build/libs/*.jar
