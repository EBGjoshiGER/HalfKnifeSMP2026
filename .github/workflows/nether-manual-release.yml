name: Nether manuelle Freischaltung testen und vorbereiten
on:
  push:
    branches: [main]
    paths:
      - 'mods/nether-project/**'
      - 'scripts/nether_manual_release.py'
      - '.github/workflows/nether-manual-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halfknife-nether-manual-release
  cancel-in-progress: false
jobs:
  build-test-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Mod bauen
        working-directory: mods/nether-project
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nether-project-2.4.0
          path: mods/nether-project/build/libs/*.jar
      - name: Isoliert testen und fuer Neustart installieren
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/nether_manual_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nether-manual-test-logs
          path: temp/nether-manual-smoke/*.log
