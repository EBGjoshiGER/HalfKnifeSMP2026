name: End-Reparatur vorbereiten (nur lesend)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halfknife-end-repair-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 -m pip install nbtlib==2.0.4
      - name: End-Reparatur isoliert testen ohne Produktionsschreibzugriff
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 -u scripts/prepare_end_repair.py
