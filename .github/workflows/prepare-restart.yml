name: Neustart vorbereiten
on:
  push:
    branches: ['maintenance/restart-2026-10-25']
    paths: ['.github/workflows/prepare-restart.yml', 'scripts/prepare_restart.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halfknife-restart-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Anzeige-Konfiguration und Mod-Schnittstellen prüfen (nur lesend)
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,io,os,json,zipfile,subprocess
          from pathlib import Path
          f=ftplib.FTP(timeout=30)
          f.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT') or 21))
          f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          def read(p):
              b=io.BytesIO();f.retrbinary('RETR '+p,b.write);return b.getvalue()
          mods=[p.rsplit('/',1)[-1] for p in f.nlst('mods') if p.endswith('.jar')]
          props=read('server.properties').decode()
          world=next(line.split('=',1)[1].strip() for line in props.splitlines() if line.startswith('level-name='))
          print('WORLD',world)
          for p in [world+'/config/playtime-rewards/config.json','config/eclipsescustomname.json']:
              data=json.loads(read(p))
              print('CONFIG',p,json.dumps(data,ensure_ascii=True))
          name=next(n for n in mods if n.startswith('playtime-rewards'))
          Path('/tmp/rewards.jar').write_bytes(read('mods/'+name))
          print(subprocess.run(['javap','-c','-p','-classpath','/tmp/rewards.jar','com.sovern.playtimerewards.LuckPermsRankIntegration'],capture_output=True,text=True,check=True).stdout)
          f.close()
          PY
