name: Neustart vorbereiten
on:
  push:
    branches: ['maintenance/restart-2026-10-25']
    paths: ['.github/workflows/prepare-restart.yml', 'scripts/prepare_restart.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halfknife-restart-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Anzeige-Konfiguration und Mod-Schnittstellen prüfen (nur lesend)
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib,io,os,json,zipfile,subprocess
          from pathlib import Path
          f=ftplib.FTP(timeout=30)
          f.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT') or 21))
          f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
          def read(p):
              b=io.BytesIO();f.retrbinary('RETR '+p,b.write);return b.getvalue()
          mods=[p.rsplit('/',1)[-1] for p in f.nlst('mods') if p.endswith('.jar')]
          for directory in ['config','world','world/config']:
              try:print('FILES',directory,[p.rsplit('/',1)[-1] for p in f.nlst(directory) if any(s in p.lower() for s in ('playtime','customname','name','prefix','rank'))])
              except ftplib.error_perm:pass
          for name in mods:
              if 'playtime-rewards' in name or 'customname' in name:
                  data=read('mods/'+name);Path('/tmp/'+name).write_bytes(data)
                  z=zipfile.ZipFile(io.BytesIO(data))
                  print('CLASSES',name,[n for n in z.namelist() if n.endswith('.class')])
                  if 'playtime-rewards' in name:
                      for cls in ['com.sovern.playtimerewards.PlaytimeRewardsMod','com.sovern.playtimerewards.PlaytimeRewardsMod$Config']:
                          text=subprocess.run(['javap','-c','-p','-classpath','/tmp/'+name,cls],capture_output=True,text=True,check=True).stdout
                          lines=text.splitlines();show=False
                          for line in lines:
                              if line.startswith('  ') and not line.startswith('    ') and line.endswith(';'):
                                  show=any(s in line for s in ('ensureReady(', 'loadAll(', 'syncPlayer(', 'refreshRank(', 'load(', 'syncLuckPerms(', 'onInitialize('))
                              if show:print(line)
                  else:
                      for cls in [n[:-6].replace('/','.') for n in z.namelist() if n.endswith('.class') and 'mixin' in n.lower()]:
                          print(subprocess.run(['javap','-c','-p','-classpath','/tmp/'+name,cls],capture_output=True,text=True).stdout)
          f.close()
          PY
