name: Minecraft Spielzeiten synchronisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_playtime.py
      - .github/workflows/sync-playtime.yml
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: halfknife-playtime-sync
  cancel-in-progress: false

jobs:
  sync-playtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spielzeiten vom Server lesen
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/sync_playtime.py
      - name: Spielzeiten prüfen und speichern
        run: |
          python3 -m json.tool data/playtime.json > /dev/null
          git config user.name "HalfKnife SMP Bot"
          git config user.email "actions@github.com"
          git add data/playtime.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Minecraft Spielzeiten automatisch aktualisiert"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
