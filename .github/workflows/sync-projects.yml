name: Nether- und End-Projekt synchronisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_projects.py
      - .github/workflows/sync-projects.yml
  schedule:
    - cron: "1-59/5 * * * *"
permissions:
  contents: write
concurrency:
  group: halfknife-project-sync
  cancel-in-progress: false
jobs:
  sync-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Projektdateien ausschließlich lesen
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/sync_projects.py
      - name: Website-Projektstände speichern
        run: |
          python3 -m json.tool data/nether-project.json > /dev/null
          python3 -m json.tool data/end-project.json > /dev/null
          git config user.name "HalfKnife SMP Bot"
          git config user.email "actions@github.com"
          git add data/nether-project.json data/end-project.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Nether- und End-Fortschritt automatisch aktualisiert"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
