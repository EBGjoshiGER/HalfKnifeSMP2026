name: Minecraft Statistiken synchronisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_statistics.py
      - .github/workflows/sync-statistics.yml
  schedule:
    - cron: "3-59/5 * * * *"
permissions:
  contents: write
concurrency:
  group: halfknife-statistics-sync
  cancel-in-progress: false
jobs:
  sync-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Statistiken vom Server lesen
        env:
          FTP_HOST: ${{ secrets.SERVERMINER_FTP_HOST }}
          FTP_PORT: ${{ secrets.SERVERMINER_FTP_PORT }}
          FTP_USER: ${{ secrets.SERVERMINER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SERVERMINER_FTP_PASSWORD }}
        run: python3 scripts/sync_statistics.py
      - name: Statistiken prüfen und speichern
        run: |
          python3 -m json.tool data/statistics.json > /dev/null
          git config user.name "HalfKnife SMP Bot"
          git config user.email "actions@github.com"
          git add data/statistics.json
          if [ -f data/stat-labels.json ]; then
            git add data/stat-labels.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Minecraft Spielerstatistiken automatisch aktualisiert"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
