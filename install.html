<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>HalfKnife SMP 2026 – Installation</title>
  <style>
/* Hintergrund + Blur */
body {
  margin: 0;
  padding: 40px;
  font-family: Arial, sans-serif;
  color: #e0e0e0;
  background-image: url('background.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0, 0, 0, 0.55);
  z-index: -1;
}

/* Container */
.container {
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 1;
}

/* Logo oben */
.logo-container {
  margin-bottom: 20px;
}

.logo {
  height: 70px;
  width: auto;
  filter: drop-shadow(0 0 6px #000);
}

/* Navigation darunter */
.nav {
  background: rgba(0, 0, 0, 0.55);
  padding: 15px 25px;
  border-radius: 10px;
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}

.nav a {
  color: #4fc3f7;
  text-decoration: none;
  font-weight: bold;
}

/* Buttons */
.button {
  display: inline-block;
  padding: 12px 20px;
  background: #4fc3f7;
  color: #000;
  text-decoration: none;
  border-radius: 6px;
  margin-top: 20px;
  font-weight: bold;
  position: relative;
  z-index: 1;
}

/* Sections */
.section {
  margin-top: 40px;
  line-height: 1.8;
}

h1 {
  color: #4fc3f7;
  font-size: 42px;
  margin-bottom: 10px;
}

h2 {
  color: #81d4fa;
  margin-top: 40px;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}
  </style>
</head>
