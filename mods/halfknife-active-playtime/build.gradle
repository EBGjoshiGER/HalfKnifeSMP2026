plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}
version = '1.2.0'
group = 'de.halfknife'
base { archivesName = 'halfknife-active-playtime' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
tasks.register('clockTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.halfknife.playtime.ActiveClockTest'
}
check.dependsOn clockTest

// The clock regression suite runs through clockTest (standalone Java main).
tasks.named('test') { failOnNoDiscoveredTests = false }
